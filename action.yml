name: 'GitHub to Slack Lookup'
description: 'Resolve a GitHub username to a Slack user ID on-the-fly. No mapping file required. Email-first match, name-search fallback, JSON overrides for edge cases.'
author: 'PsiKai'
branding:
  icon: 'user-check'
  color: 'purple'

inputs:
  github-username:
    description: 'The GitHub login to resolve. Defaults to `github.actor` (the user who triggered the workflow). Override with e.g. the PR author login when running on `workflow_run` or pulling from a different event.'
    required: false
    default: ${{ github.actor }}
  slack-token:
    description: |
      Slack token with scopes `users:read` and `users:read.email`. A bot token (xoxb-) works.
    required: true
  github-token:
    description: |
      GitHub token used to read the user profile (`GET /users/{login}`).
      The default `secrets.GITHUB_TOKEN` is sufficient.
    required: false
    default: ${{ github.token }}
  email-domain:
    description: |
      Optional fallback corporate email domain (e.g. `coalesce.io`). Only used when the
      user has no commit history in the calling repo AND no public email — in that case,
      the action derives `{first}.{last}@<domain>` from the GitHub `name` field and tries
      one more Slack lookup. Safe to omit for most repos.
    required: false
    default: ''
  overrides:
    description: |
      Optional JSON object mapping GitHub login → Slack user ID, applied before any lookup.
      Example: `{"mhagglund":"U07NK4YPC02","beckjake":"U03PR4KH51R"}`. Useful for renamed
      accounts or name-change edge cases.
    required: false
    default: '{}'
  fallback-mention-format:
    description: |
      Template returned as `mention` output when no Slack user is found.
      `{login}` is substituted with the GitHub username.
    required: false
    default: '`@{login}` _(Slack ID not found — add yourself to the org Slack or contact infra)_'

outputs:
  slack-id:
    description: 'Resolved Slack user ID (e.g. `U05UCB72807`), or empty string if no match.'
    value: ${{ steps.lookup.outputs.slack_id }}
  found:
    description: '`true` if a Slack user was matched, else `false`.'
    value: ${{ steps.lookup.outputs.found }}
  match-method:
    description: '`override` | `email-public` | `email-derived` | `name-search` | `none`.'
    value: ${{ steps.lookup.outputs.match_method }}
  mention:
    description: |
      `<@U123ABC>` when found (renders as a Slack mention), otherwise the rendered
      `fallback-mention-format`. Drop this directly into a Slack message body.
    value: ${{ steps.lookup.outputs.mention }}

runs:
  using: 'composite'
  steps:
    - name: Resolve
      id: lookup
      shell: bash
      env:
        INPUT_GITHUB_USERNAME: ${{ inputs.github-username }}
        INPUT_SLACK_TOKEN: ${{ inputs.slack-token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_EMAIL_DOMAIN: ${{ inputs.email-domain }}
        INPUT_OVERRIDES: ${{ inputs.overrides }}
        INPUT_FALLBACK_MENTION_FORMAT: ${{ inputs.fallback-mention-format }}
      # Script writes `key=value` lines to stdout; tee them into $GITHUB_OUTPUT
      # so the action's declared outputs resolve correctly. The script itself
      # has no GitHub-specific coupling.
      run: bash "${{ github.action_path }}/lookup.sh" | tee -a "$GITHUB_OUTPUT"
